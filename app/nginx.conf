server {
  listen 80;
  root /usr/share/nginx/html;

  # $http_host garde le port : l'API s'en sert pour construire les URL des vignettes.
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_set_header Host $http_host;
  }

  location /thumbnails/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $http_host;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Application monopage : toute autre adresse (/seances/ses_001…) renvoie index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
