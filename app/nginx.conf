# Sert le front et relaie les appels à l'API : le navigateur ne parle qu'à une seule adresse.
server {
  listen 80;
  root /usr/share/nginx/html;

  # « api » est le nom du service dans docker-compose.yml.
  # La barre finale de proxy_pass retire le préfixe : /api/videos → http://api:4000/videos.
  # $http_host garde le port : l'API s'en sert pour construire les URL des vignettes.
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_set_header Host $http_host;
  }

  # Les URL des vignettes renvoyées par l'API n'ont pas le préfixe /api : on les relaie aussi.
  location /thumbnails/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $http_host;
  }

  # Fichiers JS/CSS du build : leur nom change à chaque version, on peut les garder un an en cache.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Application monopage : toute autre adresse (/seances/ses_001…) renvoie index.html.
  # index.html n'est jamais gardé en cache, pour que chaque déploiement soit pris en compte.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
