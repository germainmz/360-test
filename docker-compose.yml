# Projet complet : docker compose up --build, puis http://localhost:8080
services:
  api:
    build: .
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: ./app
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
